server {
    listen 80;
    server_name painel.comunidadeppg.com.br;

    root /usr/share/nginx/html;
    index index.html;

    # index.html nunca pode ficar em cache no navegador - senao, depois de
    # um deploy, quem ja visitou o site continua vendo a versao antiga (com
    # as rotas/bundles antigos) ate dar um hard refresh manualmente.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # O service worker e o manifesto NUNCA podem ficar em cache (o navegador precisa ver a versao nova
    # do service worker a cada visita). Vem antes da regra de js/png abaixo: location exato vence regex.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        expires 0;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        expires 0;
    }

    # Os arquivos com hash no nome (js/css/imagens do build) podem ficar em
    # cache por muito tempo com seguranca: se o conteudo mudar, o nome muda.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
